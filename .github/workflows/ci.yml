name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm --filter playground exec playwright install --with-deps chromium webkit
      - name: typecheck, test, build, package checks (publint, attw)
        run: pnpm turbo run typecheck test build lint:package
      - name: e2e (next start, storybook static)
        run: pnpm e2e
      - name: e2e (next dev, StrictMode + dev-only accessible name checks)
        run: pnpm e2e:dev
